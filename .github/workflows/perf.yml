name: perf

# v1.1 release-gate per release-planning v2.1 §6.2: any p95 regression
# > 10 % vs the frozen `benches/baselines/<release>.json` blocks merge
# unless explicitly justified. Runs only on Linux for measurement
# stability — macOS / Windows runners give different numbers and
# would need their own per-platform baselines (deferred to v1.2 if
# the cross-platform perf surface ever surfaces an actual issue).
#
# Trigger scope: pushes / PRs that touch code or bench infrastructure.
# Doc-only changes don't pay the ~5 minute bench cost. The
# `paths-include` list here mirrors the inverse of `ci.yml`'s
# `paths-ignore`.

on:
  push:
    branches: [main, dev, develop]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/perf.yml'
  pull_request:
    branches: [main, dev, develop]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/perf.yml'

env:
  CARGO_TERM_COLOR: always
  # Bench corpus size. Default is 1k for fast CI; pre-release sweeps
  # at 10k / 100k are documented in benches/baselines/README.md and
  # run manually rather than in CI.
  MNEME_BENCH_N: '1000'

jobs:
  perf:
    name: criterion + p95 regression gate
    runs-on: ubuntu-latest
    # The bench job genuinely takes ~3-5 minutes (model-free, stub
    # embedder, but four benches × 50 samples × ~1k iters each adds
    # up). Cap at 20 minutes so a wedged bench doesn't sit forever.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bench artefacts go under target/release/deps/<bench>-<hash>;
          # cache them alongside the rest so re-runs on the same
          # branch reuse builds.
          shared-key: perf-bench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: cargo bench (hot path, n=${{ env.MNEME_BENCH_N }})
        # Run the four hot-path benches plus the encryption-overhead
        # bench. `criterion` writes per-bench JSON under
        # target/criterion/<group>/<id>/new/. The next step extracts a
        # single comparable JSON from those.
        #
        # `encryption_overhead` was written for v1.2 but never wired in
        # here, so the AEAD layer had no CI signal at all. It is gated
        # by ratio rather than against the frozen baseline — see the
        # dedicated step below.
        run: |
          cargo bench --bench remember --bench recall \
                      --bench cold_start --bench auto_context \
                      --bench encryption_overhead \
                      -- --quick

      - name: extract baseline JSON for this run
        run: |
          mkdir -p /tmp/perf
          python3 benches/baselines/extract_baseline.py \
                  /tmp/perf/this-run.json \
                  --corpus ${{ env.MNEME_BENCH_N }}
          echo "::group::This run's numbers (p95 µs)"
          python3 -c "
          import json
          d = json.load(open('/tmp/perf/this-run.json'))['benches']
          for k, v in d.items():
              print(f'{k:55s}  p95={v[\"p95_ns\"]/1000:>10.2f} µs')
          "
          echo "::endgroup::"

      - name: compare against frozen baseline
        # FAIL on any p95 > 10 % over the frozen v0.2.6 reference.
        # The `compare.py` script handles the diff + exit code. PRs
        # that legitimately need to regress perf (rare) should
        # update the baseline JSON in the same commit and explain
        # in the description per release-planning §6.2.
        #
        # The crypto benches are excluded here and gated by ratio in the
        # next step: the frozen baseline predates them, and absolute
        # sub-microsecond numbers do not transfer between the Apple
        # Silicon capture host and this runner. `compare.py` reports
        # them under "benches added since baseline" either way.
        run: |
          python3 benches/baselines/compare.py \
                  benches/baselines/v0_2_6.json \
                  /tmp/perf/this-run.json \
                  --exclude encrypted_

      - name: informational compare against the platform-matched baseline
        # NON-BLOCKING on purpose.
        #
        # The blocking gate above uses `v0_2_6.json`, captured on Apple
        # Silicon, while this job runs on x86_64 Linux. That mismatch is
        # not cosmetic: `auto_context/no_query` measures ~216 µs on the
        # capture host and ~235-245 µs here, so it sits permanently near
        # the 10 % threshold for reasons that have nothing to do with the
        # diff under test.
        #
        # `v1_2_2_linux_x86_64.json` is a median-of-3 capture on x86_64
        # Linux — same platform as this runner, though not the same
        # machine. It is reported but not enforced until a maintainer has
        # watched a few runs and confirmed it is stable on GitHub's
        # runners; see benches/baselines/README.md for the promotion
        # procedure.
        continue-on-error: true
        run: |
          python3 benches/baselines/compare.py \
                  benches/baselines/v1_2_2_linux_x86_64.json \
                  /tmp/perf/this-run.json \
                  --exclude encrypted_

      - name: encryption overhead ratio gate
        # Compares encrypted vs plain *within this run*, so it is
        # machine-independent. Catches the crypto layer itself
        # regressing (e.g. a per-record key derivation creeping in)
        # without pretending absolute nanoseconds are portable.
        run: |
          python3 benches/baselines/check_crypto_overhead.py \
                  --baseline /tmp/perf/this-run.json

      - name: archive criterion report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report-${{ github.sha }}
          path: |
            target/criterion/**/new/estimates.json
            target/criterion/**/new/sample.json
            /tmp/perf/this-run.json
          retention-days: 14
