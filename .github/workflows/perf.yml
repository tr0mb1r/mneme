name: perf

# Perf regression gate (release-planning v2.1 §6.2, revised after 1.5).
# Each run benchmarks the base commit and the change on the same runner
# and fails if a hot-path median slows by more than 15 %. The frozen
# `benches/baselines/*.json` files are still compared, informationally:
# absolute numbers do not transfer between GitHub runner hosts, so they
# cannot gate. Linux only, for measurement stability.
#
# Trigger scope: pushes / PRs that touch code or bench infrastructure.
# Doc-only changes don't pay the ~5 minute bench cost. The
# `paths-include` list here mirrors the inverse of `ci.yml`'s
# `paths-ignore`.

on:
  push:
    branches: [main, dev, develop]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/perf.yml'
  pull_request:
    branches: [main, dev, develop]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/perf.yml'

env:
  CARGO_TERM_COLOR: always
  # Bench corpus size. Default is 1k for fast CI; pre-release sweeps
  # at 10k / 100k are documented in benches/baselines/README.md and
  # run manually rather than in CI.
  MNEME_BENCH_N: '1000'

jobs:
  perf:
    name: criterion + same-runner regression gate
    runs-on: ubuntu-latest
    # The bench job genuinely takes ~3-5 minutes (model-free, stub
    # embedder, but four benches × 50 samples × ~1k iters each adds
    # up), and the gate runs them twice (base, then head). Cap at 40
    # minutes so a wedged bench doesn't sit forever.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bench artefacts go under target/release/deps/<bench>-<hash>;
          # cache them alongside the rest so re-runs on the same
          # branch reuse builds.
          shared-key: perf-bench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: resolve the commit to compare against
        # The blocking gate compares this change against its base,
        # benchmarked on this same runner in this same job. Absolute
        # numbers swing by 2x between GitHub runner hosts, so comparing
        # against a frozen file captured elsewhere flagged noise as
        # regressions (and let real ones through on a fast host).
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "no base commit; the same-runner gate is skipped"
            exit 0
          fi
          if git fetch --no-tags --depth=1 origin "$base"; then
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "::warning::could not fetch base $base; the same-runner gate is skipped"
          fi

      - name: cargo bench at the base commit
        if: steps.base.outputs.sha != ''
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_ENV"
          git checkout --quiet --detach "${{ steps.base.outputs.sha }}"
          cargo bench --bench remember --bench recall \
                      --bench cold_start --bench auto_context \
                      -- --quick
          mkdir -p /tmp/perf
          python3 benches/baselines/extract_baseline.py \
                  /tmp/perf/base.json \
                  --corpus ${{ env.MNEME_BENCH_N }}
          rm -rf target/criterion
          git checkout --quiet --detach "$head"

      - name: cargo bench (hot path, n=${{ env.MNEME_BENCH_N }})
        # Run the four hot-path benches plus the encryption-overhead
        # bench. `criterion` writes per-bench JSON under
        # target/criterion/<group>/<id>/new/. The next step extracts a
        # single comparable JSON from those.
        run: |
          cargo bench --bench remember --bench recall \
                      --bench cold_start --bench auto_context \
                      --bench encryption_overhead \
                      -- --quick

      - name: extract baseline JSON for this run
        run: |
          mkdir -p /tmp/perf
          python3 benches/baselines/extract_baseline.py \
                  /tmp/perf/this-run.json \
                  --corpus ${{ env.MNEME_BENCH_N }}
          echo "::group::This run's numbers (p95 µs)"
          python3 -c "
          import json
          d = json.load(open('/tmp/perf/this-run.json'))['benches']
          for k, v in d.items():
              print(f'{k:55s}  p95={v[\"p95_ns\"]/1000:>10.2f} µs')
          "
          echo "::endgroup::"

      - name: compare against the base commit (same runner)
        # BLOCKING. p50 rather than p95: with `--quick` sampling the
        # tail is the noisiest statistic even on one host, and a real
        # hot-path regression moves the median too. 15 % leaves room for
        # run-to-run jitter between the two passes. A PR that regresses
        # on purpose says why in its description and an admin merges it
        # through the ruleset bypass.
        if: steps.base.outputs.sha != ''
        run: |
          python3 benches/baselines/compare.py \
                  /tmp/perf/base.json \
                  /tmp/perf/this-run.json \
                  --exclude encrypted_ \
                  --metric p50_ns \
                  --tolerance-pct 15

      - name: informational compare against the frozen baselines
        # NON-BLOCKING. `v0_2_6.json` was captured on Apple Silicon and
        # predates hybrid recall; `v1_2_2_linux_x86_64.json` is a
        # median-of-3 on x86_64 Linux but a different machine. Both are
        # kept for the long-term trend, not for gating.
        continue-on-error: true
        run: |
          python3 benches/baselines/compare.py \
                  benches/baselines/v0_2_6.json \
                  /tmp/perf/this-run.json \
                  --exclude encrypted_ || true
          python3 benches/baselines/compare.py \
                  benches/baselines/v1_2_2_linux_x86_64.json \
                  /tmp/perf/this-run.json \
                  --exclude encrypted_

      - name: encryption overhead ratio gate
        # Compares encrypted vs plain *within this run*, so it is
        # machine-independent. Catches the crypto layer itself
        # regressing (e.g. a per-record key derivation creeping in)
        # without pretending absolute nanoseconds are portable.
        run: |
          python3 benches/baselines/check_crypto_overhead.py \
                  --baseline /tmp/perf/this-run.json

      - name: archive criterion report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report-${{ github.sha }}
          path: |
            target/criterion/**/new/estimates.json
            target/criterion/**/new/sample.json
            /tmp/perf/this-run.json
          retention-days: 14
